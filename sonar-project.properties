# SonarQube Project Configuration for GyanAI Digital Library Intelligence Platform
sonar.projectKey=paruluniversity_gyanai
sonar.projectName=GyanAI Digital Library Platform
sonar.projectVersion=1.0.0

sonar.sources=backend/src,frontend/src
sonar.tests=backend/src/__tests__,frontend/cypress
sonar.language=ts
sonar.sourceEncoding=UTF-8

# Coverage & Exclusions
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**
sonar.cpd.exclusions=**/__tests__/**
