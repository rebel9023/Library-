groups:
  - name: gyanai_alerts
    rules:
      - alert: HighCPUUsage
        expr: system_cpu_usage_percent > 85
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High CPU usage on GyanAI backend (> 85%)"

      - alert: HighAPIErrorRate
        expr: rate(api_errors_total[5m]) > 0.05
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "API Error rate elevated on GyanAI backend"

      - alert: OllamaDown
        expr: ollama_health_status == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Ollama Local LLM Container is unreachable"

      - alert: QdrantDown
        expr: qdrant_health_status == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Qdrant Vector DB is unreachable"
