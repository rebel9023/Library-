global:
  scrape_interval: 10s
  evaluation_interval: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']

rule_files:
  - 'alert.rules.yml'

scrape_configs:
  - job_name: 'gyanai-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:5000']
